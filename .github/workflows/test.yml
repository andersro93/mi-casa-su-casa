name: Tests

# The single definition of "the Go suite is green": lint/typecheck, the
# release config lint, the frontend/unit test suite, and Go vet + tests
# against a real Postgres. Reusable — called by ci.yml (every pull
# request) and release.yml (every push to main), so the quality gate is
# defined once and cannot drift between the two.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      # The Go suite runs against a real Postgres — the whole point, given
      # the backend's storage is Postgres.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: micasa
          POSTGRES_PASSWORD: micasa
          POSTGRES_DB: micasa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U micasa -d micasa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://micasa:micasa@127.0.0.1:5432/micasa_test

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Toolchain from .mise.toml — the same pins developers get from
      # `mise install`. install_args also pulls in oapi-codegen and sqlc:
      # apps/server/internal/api/spec_sync_test.go runs oapi-codegen from
      # PATH to guard against generated-code drift and never skips, and
      # apps/server/internal/db/sqlc_sync_test.go does the same with sqlc
      # against the committed query bindings.
      # goreleaser is here for the config lint below — the release
      # pipeline's own config, checked on every PR rather than at release
      # time. cache: true lets mise-action cache these Go-built tools
      # instead of recompiling them on every run.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go bun node go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen go:github.com/sqlc-dev/sqlc/cmd/sqlc aqua:goreleaser/goreleaser"
          cache: true

      # mise does not cache Go modules; do it directly, keyed on the module
      # that actually owns go.sum.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('apps/server/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint + typecheck
        run: bun run check

      # The release pipeline's config is code too — a broken .goreleaser.yaml
      # should fail here, not halfway through a release that has already
      # pushed a tag.
      - name: GoReleaser config check
        run: goreleaser check

      - name: Frontend tests
        run: bun run test

      # apps/server is the backend: a Go module, outside the bun workspace,
      # so the steps above never touch it. Same TEST_DATABASE_URL, same
      # Postgres service — -p 1 because Go test packages that share tables
      # are not safe to run as concurrent packages against one database.
      - name: Go vet
        run: cd apps/server && go vet ./...

      - name: Go tests
        run: cd apps/server && go test -p 1 -count=1 ./...
