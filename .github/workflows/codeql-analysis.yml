name: CodeQL Analysis

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # The Go backend. Go is a compiled language, so CodeQL has to watch
          # a real build — and the module is not at the repository root
          # (apps/server owns go.mod), which autobuild is not dependable
          # about finding. `manual` plus an explicit `go build ./...` in the
          # module directory leaves nothing to guess.
          - language: go
            build-mode: manual
          # The SPA. JavaScript/TypeScript is extracted straight from source:
          # there is nothing to build, and no dependency install to do.
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same Go pin the rest of CI uses, so CodeQL observes a build from
      # the toolchain the release itself is built with.
      - if: matrix.language == 'go'
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: "go"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build for analysis
        if: matrix.build-mode == 'manual'
        run: cd apps/server && go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:${{ matrix.language }}"
