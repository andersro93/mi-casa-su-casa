name: Preview Deploy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate pull request
        run: npm run ci

      - name: Apply preview D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:apply:preview

      - name: Deploy preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:preview

      - name: Comment preview status on pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ vars.CLOUDFLARE_PREVIEW_URL }}
        with:
          script: |
            const marker = '<!-- mcsc-preview-deploy -->';
            const previewUrl = process.env.PREVIEW_URL?.trim();
            const body = previewUrl
              ? `${marker}\n✅ Preview deployment is ready.\n\n- URL: ${previewUrl}\n- Database: \`mi-casa-su-casa-preview\``
              : `${marker}\n✅ Preview deployment completed.\n\nSet the repository variable \`CLOUDFLARE_PREVIEW_URL\` to surface the preview URL automatically in this comment.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  preview-unavailable-for-forks:
    if: github.event.pull_request.head.repo.full_name != github.repository || secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == ''
    runs-on: ubuntu-latest

    steps:
      - name: Explain why preview deploy is skipped
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- mcsc-preview-deploy -->';
            const fromFork = context.payload.pull_request.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo;
            const body = fromFork
              ? `${marker}\n⚠️ Preview deployment was skipped for this pull request because GitHub does not expose Cloudflare deployment secrets to workflows triggered from forks.`
              : `${marker}\n⚠️ Preview deployment was skipped because the repository is missing \`CLOUDFLARE_API_TOKEN\` and/or \`CLOUDFLARE_ACCOUNT_ID\` secrets required for Wrangler deploys.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
