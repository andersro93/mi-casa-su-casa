          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not an owner of this household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/{slug}/invitations/{invitationId}/resend:
    post:
      operationId: resendInvitation
      summary: >-
        Issue a fresh invitation to the same person with the same role and
        provider scope, cancelling the old one. A new token, so the link in
        the first email stops working — which is what makes "resend" safe to
        offer after a link has been forwarded to the wrong inbox.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/HouseholdSlug"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: The replacement invitation, its link, and the delivery outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResult"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not an owner of this household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such invitation in this household, or it is no longer pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/{slug}/invitations/{invitationId}:
    delete:
      operationId: cancelInvitation
      summary: Cancel a pending invitation, which makes its link stop working.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/HouseholdSlug"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: The invitation is cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not an owner of this household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such invitation in this household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    HouseholdSlug:
      name: slug
      in: path
      required: true
      description: >-
        The household this request acts on. Every `{slug}` route is guarded by
        the tenancy middleware, which turns it into a membership or refuses —
        so the parameter is also the authorization boundary, not just a lookup
        key.

        REF §A3's length bounds (2..40) are deliberately NOT stated here. A
        slug outside them cannot name a household, so it must be answered the
        way every other non-membership is — 403, never a validation error that
        distinguishes "no such household" from "not yours".
      schema:
        type: string
        minLength: 1
        maxLength: 200
    InvitationToken:
      name: X-Invitation-Token
      in: header
      required: false
      description: >-
        The invitation token from the link. A header rather than a path or
        query parameter so the secret never lands in a request log, a browser
        history entry or a Referer.

        Declared optional, and with no length bounds, so that EVERY way of
        getting the token wrong is answered by the handler rather than by a
        schema violation: a missing or empty header with REF §A2's "Invitation
        token header is required", and a token of any length that does not
        match a stored hash with the same 404 as a wrong one. A `minLength`
        here would turn an empty header into a validation message, and a
        `maxLength` would tell a guesser that their token was at least the
        right size. It is mandatory in practice.
      schema:
        type: string
    ProviderId:
      name: providerId
      in: path
      required: true
      description: A provider's id. Scoped to the household in the path, so an id from another household is a 404 rather than a leak.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    SenderRuleId:
      name: ruleId
      in: path
      required: true
      description: A sender rule's id, scoped to the household in the path.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    MemberUserId:
      name: userId
      in: path
      required: true
      description: The member's user id. Membership of the household in the path is checked before anything is done with it.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: An invitation's id, scoped to the household in the path.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    MessageId:
      name: messageId
      in: path
      required: true
      description: >-
        A message's id — an inbox message for the status route, a quarantined
        one for the review route. Scoped to the household in the path, so an
        id from another household is a 404 rather than a leak.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    PageLimit:
      name: limit
      in: query
      required: false
      description: >-
        How many rows to return. Clamped to 1..200 in Go, with 50 for a
        missing value.

        Deliberately declared WITHOUT `minimum`/`maximum`: the TypeScript
        clamped an out-of-range limit rather than rejecting it, and a client
        that asks for 9999 should get 200 rows, not a validation error on a
        page it can no longer navigate away from.

        The type IS stated, which is the one place this diverges from that
        predecessor: `limit=abc` is a 400 from request validation here, where
        the TypeScript's `Number(...)` turned it into NaN and fell back to the
        default. Saying "integer" is worth that — a client sending a
        non-number is broken, and every value a working client sends is
        clamped rather than refused.
      schema:
        type: integer
    PageBefore:
      name: before
      in: query
      required: false
      description: >-
        The keyset cursor: return only rows older than this instant, which is
        the previous page's `nextBefore`.

        Declared as a plain string rather than `format: date-time` for the
        same reason `limit` has no bounds: a cursor that does not parse is
        IGNORED (the newest page is returned) rather than rejected, exactly as
        the TypeScript's normalizePageOptions did.
      schema:
        type: string
  schemas:
    Ok:
      type: object
      description: >-
        The acknowledgement every "it is done, and there is nothing to show
        for it" endpoint answers with.
      required: [ok]
      properties:
        ok:
          type: boolean
    HouseholdSummary:
      type: object
      description: >-
        One entry in the household switcher: a household plus what the caller
        may do in it.
      required: [id, slug, displayName, role]
      properties:
        id:
          type: string
        slug:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [owner, member]
    HouseholdList:
      type: object
      required: [households]
      properties:
        households:
          type: array
          items:
            $ref: "#/components/schemas/HouseholdSummary"
    CreateHouseholdRequest:
      type: object
      description: >-
        REF §A4's `createHousehold` schema. As with SetupRequest, only the
        shape is stated here: the slug is normalised (trimmed, lower-cased)
        before REF §A3's rules are applied to it, and the message each failure
        produces is the wording the SPA renders next to the input.
      required: [slug, displayName]
      properties:
        slug:
          type: string
          description: Trimmed, lower-cased, and subject to REF §A3's slug rules.
        displayName:
          type: string
          description: Trimmed, 1..80 characters.
    HouseholdWithRole:
      type: object
      description: >-
        A newly created household: the switcher entry's keys plus the
        timestamps, so the client can drop it straight into its cache.
      required: [id, slug, displayName, createdAt, updatedAt, role]
      properties:
        id:
          type: string
        slug:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        role:
          type: string
          enum: [owner, member]
    HouseholdResult:
      type: object
      required: [household]
      properties:
        household:
          $ref: "#/components/schemas/HouseholdWithRole"
    Profile:
      type: object
      description: >-
        The account settings screen's view of the caller. `role` is always
        null: it carried Better Auth's global role in the TypeScript server,
        which the Go one has no counterpart for, and stays in the payload
        because the SPA reads it.
      required: [id, email, name, image, role, twoFactorEnabled, households]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        image:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        twoFactorEnabled:
          type: boolean
        households:
          type: array
          items:
            $ref: "#/components/schemas/HouseholdSummary"
    SessionSummary:
      type: object
      description: >-
        One signed-in device. The session TOKEN is a bearer secret and never
        appears here — `isCurrent` is all the client needs to tell which row
        it is looking through. `ipAddress` is the digest Limen stored, not a
        readable address, and `impersonatedBy` is always null (the Go server
        has no impersonation).
      required:
        [
          id,
          isCurrent,
          expiresAt,
          ipAddress,
          userAgent,
          createdAt,
          updatedAt,
          impersonatedBy,
        ]
      properties:
        id:
          type: string
        isCurrent:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        impersonatedBy:
          type: string
          nullable: true
    AccountSettings:
      type: object
      required: [profile, sessions]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
    ProfileResult:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
    ProfileRequest:
      type: object
      description: >-
        REF §A4's `profile` schema. `image` is optional and an empty string
        clears the avatar; anything else must be an http(s) URL of at most
        2048 characters, checked in Go so the message is the TypeScript's
        ("image must be an http(s) URL").
      required: [name]
      properties:
        name:
          type: string
          description: Trimmed, 1..80 characters.
        image:
          type: string
          description: An http(s) URL, or "" to clear the avatar.
    Error:
      type: object
      description: >-
        The failure envelope every error response in this API uses. `fields`
        carries one message per rejected input (keyed by the property or
        parameter name, `_` for the request body as a whole); `code` is a
        stable discriminator for the few failures a client must branch on
        rather than merely display.
      required: [error]
      properties:
        error:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
        code:
          type: string
    SetupStatus:
      type: object
      description: >-
        REF §A2's setup/status body. `isConfigured` is always true in the Go
        server — internal/config requires OWNER_EMAIL and SETUP_SECRET at boot,
        so a running process cannot be missing them — and stays in the payload
        because the SPA reads it.
      required: [needsSetup, setupLocked, isConfigured, status, emailDomain]
      properties:
        needsSetup:
          type: boolean
          description: Configured, and setup has not been completed yet.
        setupLocked:
          type: boolean
          description: Setup is complete and this endpoint is the only thing left to say so.
        isConfigured:
          type: boolean
        status:
          type: string
          enum: [pending, in_progress, complete]
        emailDomain:
          type: string
          nullable: true
          description: EMAIL_DOMAIN, so the client can preview "slug@domain" while naming a household.
    SetupRequest:
      type: object
      description: >-
        REF §A4's `setup` schema. The shape — which properties exist, which are
        required, and that each is a string — is enforced here; the LENGTH and
        FORMAT rules named in each description below are enforced in Go
        (internal/api/setup.go's validateSetupBody) and deliberately not
        repeated as `minLength`/`pattern`.

        Two reasons. The values are trimmed and lower-cased before they are
        checked, so a schema rule would be testing what was sent rather than
        what is kept; and the messages the SPA renders next to each input are
        REF §A4's exact wording, which a schema violation cannot produce.
      required: [email, name, password, householdName, householdSlug, setupSecret]
      properties:
        email:
          type: string
          description: The owner's address. Trimmed and lower-cased, 3..254 characters, must look like an address.
        name:
          type: string
          description: The owner's display name. Trimmed, 1..80 characters.
        password:
          type: string
          description: 12..128 characters. Never trimmed — a space is a character the person chose.
        householdName:
          type: string
          description: The first household's display name. Trimmed, 1..80 characters.
        householdSlug:
          type: string
          description: The first household's slug. Trimmed, lower-cased, and subject to REF §A3's slug rules.
        setupSecret:
          type: string
          description: SETUP_SECRET, compared in constant time. Non-empty.
    AcceptInvitationRequest:
      type: object
      description: >-
        REF §A4's `acceptInvitation` schema, with neither property required
        here: whether they are depends on the session (see the operation's
        requestBody comment), so the requirement, the lengths and the messages
        are all enforced in Go — as they are for SetupRequest above, and for
        the same two reasons.
      properties:
        name:
          type: string
          description: The invitee's display name. Trimmed, 1..80 characters. Required when nobody is signed in.
        password:
          type: string
          description: 12..128 characters. Required when nobody is signed in.
    Member:
      type: object
      description: The account that was just created or signed in, with its role in the household.
      required: [id, email, name, role]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, member]
    Household:
      type: object
      required: [id, slug, displayName, createdAt, updatedAt]
      properties:
        id:
          type: string
        slug:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MembershipResult:
      type: object
      description: >-
        What both "you are now the owner" (setup) and "you are now a member"
        (invitation accept) answer with.
      required: [member, household]
      properties:
        member:
          $ref: "#/components/schemas/Member"
        household:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Household"
    InvitationProvider:
      type: object
      description: >-
        One provider an invitation is scoped to. snake_case keys inside a
        camelCase parent, deliberately: it is what the TypeScript returned and
        what the SPA reads.
      required: [id, provider_key, display_name]
      properties:
        id:
          type: string
        provider_key:
          type: string
        display_name:
          type: string
    Invitation:
      type: object
      description: >-
        One invitation record. The token itself never appears — only its
        SHA-256 is stored, and the plaintext lives solely in the link.
      required:
        [
          id,
          householdId,
          email,
          name,
          role,
          status,
          invitedByUserId,
          acceptedByUserId,
          expiresAt,
          acceptedAt,
          cancelledAt,
          createdAt,
          updatedAt,
          providers,
        ]
      properties:
        id:
          type: string
        householdId:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, member]
        status:
          type: string
          enum: [pending, accepted, cancelled, expired]
        invitedByUserId:
          type: string
        acceptedByUserId:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        providers:
          type: array
          items:
            $ref: "#/components/schemas/InvitationProvider"
    InvitationLookup:
      type: object
      description: >-
        Everything the invite page needs to pick a flow: create an account,
        sign in first, or accept as whoever is already signed in.
      required: [invitation, household, invitedBy, accountExists, viewer]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        household:
          type: object
          nullable: true
          required: [displayName]
          properties:
            displayName:
              type: string
        invitedBy:
          type: object
          nullable: true
          required: [name]
          properties:
            name:
              type: string
        accountExists:
          type: boolean
          description: An account already exists for the invited address.
        viewer:
          type: object
          nullable: true
          description: The signed-in caller, when there is one.
          required: [email, emailMatches]
          properties:
            email:
              type: string
            emailMatches:
              type: boolean
    AuditEvent:
      type: object
      description: >-
        One line of the audit trail. `details` is whatever the action recorded
        (the new role, the provider key, whether an invitation email got out),
        parsed back from the stored JSON.
      required:
        [id, actorUserId, householdId, action, targetType, targetId, details, createdAt]
      properties:
        id:
          type: string
        actorUserId:
          type: string
          nullable: true
        householdId:
          type: string
          nullable: true
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AuditEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
    HouseholdSettings:
      type: object
      description: >-
        A household's own settings. `emailAddress` is `slug@EMAIL_DOMAIN` —
        the address providers must be told to send to — and is null only if
        the installation has no inbound domain configured.
      required: [slug, displayName, emailAddress]
      properties:
        slug:
          type: string
        displayName:
          type: string
        emailAddress:
          type: string
          nullable: true
    HouseholdSettingsResult:
      type: object
      required: [household]
      properties:
        household:
          $ref: "#/components/schemas/HouseholdSettings"
    HouseholdSettingsRequest:
      type: object
      description: REF §A4's `householdSettings` schema. Trimmed and length-checked in Go, for the wording.
      required: [displayName]
      properties:
        displayName:
          type: string
          description: Trimmed, 1..80 characters.
    Provider:
      type: object
      description: >-
        One provider. snake_case keys, deliberately: it is what the TypeScript
        returned and what the SPA reads.
      required: [id, household_id, provider_key, display_name, created_at]
      properties:
        id:
          type: string
        household_id:
          type: string
        provider_key:
          type: string
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
    ProviderConfiguration:
      type: object
      description: A provider plus how many sender rules point at it.
      required: [id, household_id, provider_key, display_name, created_at, rule_count]
      properties:
        id:
          type: string
        household_id:
          type: string
        provider_key:
          type: string
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
        rule_count:
          type: integer
    SenderRule:
      type: object
      description: One sender rule — the address or domain whose mail files into a provider.
      required: [id, household_id, provider_id, match_type, match_value, created_at]
      properties:
        id:
          type: string
        household_id:
          type: string
        provider_id:
          type: string
        match_type:
          type: string
          enum: [exact, domain]
        match_value:
          type: string
        created_at:
          type: string
          format: date-time
    ProviderConfigurationList:
      type: object
      required: [providers, rules]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderConfiguration"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/SenderRule"
    ProviderResult:
      type: object
      required: [provider]
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
    ProviderRequest:
      type: object
      description: >-
        REF §A4's `provider` schema. Only the shape is stated here: the key is
        trimmed and lower-cased before its rules run, and the message each
        failure produces is REF §A4's wording, which a schema violation cannot
        produce.
      required: [providerKey, displayName]
      properties:
        providerKey:
          type: string
          description: Trimmed, lower-cased, 1..40, lowercase letters, numbers and hyphens, starting with a letter or number.
        displayName:
          type: string
          description: Trimmed, 1..80 characters.
    SenderRuleResult:
      type: object
      required: [rule]
      properties:
        rule:
          $ref: "#/components/schemas/SenderRule"
    SenderRuleRequest:
      type: object
      description: >-
        REF §A4's `senderRule` schema. `matchType` is a plain string here
        rather than an enum for the same reason the lengths are absent: the
        rejection must read "matchType must be exact or domain", which is
        checked in Go.
      required: [providerId, matchType, matchValue]
      properties:
        providerId:
          type: string
          description: Trimmed, 1..64 characters.
        matchType:
          type: string
          description: "`exact` or `domain`."
        matchValue:
          type: string
          description: >-
            Trimmed, lower-cased, 1..254. A domain rule drops any leading `@`
            and must then be a hostname; an exact rule must be a full email
            address.
    MemberProviderAccess:
      type: object
      description: One provider a member may read.
      required: [providerKey, displayName]
      properties:
        providerKey:
          type: string
        displayName:
          type: string
    HouseholdMember:
      type: object
      description: >-
        One member of the household, with the providers they may read. `role`
        duplicates `householdRole`: it carried Better Auth's global role in the
        TypeScript server and the SPA reads both, so the Go server puts the
        household role in each.
      required: [id, householdRole, email, name, role, createdAt, updatedAt, providerAccess]
      properties:
        id:
          type: string
        householdRole:
          type: string
          enum: [owner, member]
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, member]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        providerAccess:
          type: array
          items:
            $ref: "#/components/schemas/MemberProviderAccess"
    MemberList:
      type: object
      required: [members, providers]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/HouseholdMember"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/Provider"
    CreateMemberRequest:
      type: object
      description: >-
        REF §A4's `createMember` schema. `role` is a plain string, defaulting
        to member when absent: the enum would reject `admin`, which REF §A4
        accepts and maps to owner, and its rejection would not read "role must
        be owner or member".
      required: [email, name]
      properties:
        email:
          type: string
          description: Trimmed, lower-cased, 3..254 characters, must look like an address.
        name:
          type: string
          description: Trimmed, 1..80 characters.
        role:
          type: string
          description: "`owner` or `member` (`admin` is accepted and means owner). Defaults to member."
    RoleChangeRequest:
      type: object
      description: REF §A4's `roleChange` schema. See CreateMemberRequest for why `role` is not an enum here.
      required: [role]
      properties:
        role:
          type: string
          description: "`owner` or `member` (`admin` is accepted and means owner)."
    ProviderAccessRequest:
      type: object
      description: REF §A4's `providerAccess` schema.
      required: [providerKey]
      properties:
        providerKey:
          type: string
          description: Trimmed, lower-cased, 1..40 characters.
    InvitationList:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
    InvitationRequest:
      type: object
      description: >-
        REF §A4's `invitation` schema. See CreateMemberRequest for why `role`
        is a plain string.
      required: [email, name]
      properties:
        email:
          type: string
          description: Trimmed, lower-cased, 3..254 characters, must look like an address.
        name:
          type: string
          description: Trimmed, 1..80 characters.
        role:
          type: string
          description: "`owner` or `member` (`admin` is accepted and means owner). Defaults to member."
        providerIds:
          type: array
          description: The providers the invitee may read the moment they accept. At most 50; every id must belong to this household.
          items:
            type: string
    InvitationResult:
      type: object
      description: >-
        A newly issued invitation, its link, and whether the email carrying
        that link got out. A failed delivery is NOT an error (REF §A3): the
        invitation stands and `inviteUrl` can be shared by hand, so
        `emailSent` is false and `emailError` says what went wrong.
      required: [invitation, inviteUrl, emailSent]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        inviteUrl:
          type: string
        emailSent:
          type: boolean
        emailError:
          type: string
    ProviderSummary:
      type: object
      description: >-
        One provider's tile on the inbox landing page: its counts plus a
        preview of the newest message. snake_case keys, deliberately: it is
        what the TypeScript returned and what the SPA reads.

        The `latest_*` fields are null — present and null, never missing —
        for a provider that has received nothing yet.
      required:
        [
          household_slug,
          provider_key,
          display_name,
          message_count,
          new_count,
          latest_received_at,
          latest_message_id,
          latest_subject,
          latest_code,
          latest_status,
        ]
      properties:
        household_slug:
          type: string
        provider_key:
          type: string
        display_name:
          type: string
        message_count:
          type: integer
        new_count:
          type: integer
        latest_received_at:
          type: string
          format: date-time
          nullable: true
        latest_message_id:
          type: string
          nullable: true
        latest_subject:
          type: string
          nullable: true
        latest_code:
          type: string
          nullable: true
        latest_status:
          type: string
          nullable: true
    ProviderSummaryList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderSummary"
    InboxProvider:
      type: object
      description: >-
        Which provider a page of messages belongs to. camelCase here while the
        rows below are snake_case, because that is the shape the SPA has read
        since the Workers deployment.
      required: [providerKey, displayName]
      properties:
        providerKey:
          type: string
        displayName:
          type: string
    InboxMessage:
      type: object
      description: One message in a provider's inbox. snake_case keys, as above.
      required:
        [
          id,
          household_slug,
          provider_key,
          provider_display_name,
          subject,
          from_header,
          text_body,
          extracted_code,
          status,
          received_at,
        ]
      properties:
        id:
          type: string
        household_slug:
          type: string
        provider_key:
          type: string
        provider_display_name:
          type: string
        subject:
          type: string
          nullable: true
        from_header:
          type: string
          nullable: true
        text_body:
          type: string
        extracted_code:
          type: string
          nullable: true
        status:
          type: string
          enum: [new, used, expired]
        received_at:
          type: string
          format: date-time
    QuarantineMessage:
      type: object
      description: >-
        One row of the needs-review queue. `provider_key` and
        `provider_display_name` are the literals "quarantine" and
        "Quarantine" so the SPA can render it with the same component as an
        inbox row, and `envelope_from` is included because who the mail
        server said sent it is the main thing an owner reviews.
      required:
        [
          id,
          household_slug,
          provider_key,
          provider_display_name,
          subject,
          from_header,
          envelope_from,
          text_body,
          extracted_code,
          status,
          quarantine_reason,
          received_at,
        ]
      properties:
        id:
          type: string
        household_slug:
          type: string
        provider_key:
          type: string
        provider_display_name:
          type: string
        subject:
          type: string
          nullable: true
        from_header:
          type: string
          nullable: true
        envelope_from:
          type: string
        text_body:
          type: string
        extracted_code:
          type: string
          nullable: true
        status:
          type: string
        quarantine_reason:
          type: string
        received_at:
          type: string
          format: date-time
    PageInfo:
      type: object
      description: >-
        The keyset page the server actually served: the limit it applied
        (after clamping) and the cursor for the next, older page.

        `nextBefore` is null when this was the last page, which is what the
        SPA checks to decide whether to offer "load more".
      required: [limit, nextBefore]
      properties:
        limit:
          type: integer
        nextBefore:
          type: string
          format: date-time
          nullable: true
    InboxMessagePage:
      type: object
      required: [provider, messages, page]
      properties:
        provider:
          $ref: "#/components/schemas/InboxProvider"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/InboxMessage"
        page:
          $ref: "#/components/schemas/PageInfo"
    QuarantineMessagePage:
      type: object
      required: [messages, page]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/QuarantineMessage"
        page:
          $ref: "#/components/schemas/PageInfo"
    InboxMessageResult:
      type: object
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/InboxMessage"
    MessageStatusRequest:
      type: object
      description: >-
        REF §A4's `messageStatus` schema. `status` is a plain string rather
        than an enum for the same reason `matchType` is (see
        SenderRuleRequest): the rejection must read "status must be new, used
        or expired", and an enum violation cannot say that.
      required: [status]
      properties:
        status:
          type: string
          description: "`new`, `used` or `expired`."
    QuarantineReviewRequest:
      type: object
      description: >-
        REF §A4's `quarantineReview` schema. `action` is a plain string for
        the reason MessageStatusRequest's `status` is; `providerKey` is
        required in practice for a release, but the 400 that says so is the
        handler's, because it names the field.
      required: [action]
      properties:
        action:
          type: string
          description: "`dismiss` or `release`."
        providerKey:
          type: string
          description: >-
            The provider to release into. Trimmed, lower-cased, 1..40.
            Required for a release, ignored for a dismissal.
    QuarantineReviewResult:
      type: object
      description: >-
        The outcome of one review. `releasedMessage` is the stored copy for a
        release and null for a dismissal — present and null, never missing.
      required: [reviewedAt, releasedMessage]
      properties:
        reviewedAt:
          type: string
          format: date-time
        releasedMessage:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InboxMessage"
