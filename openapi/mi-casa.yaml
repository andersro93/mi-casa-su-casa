openapi: 3.0.3
info:
  title: Mi Casa Su Casa API
  description: >-
    Mi Casa Su Casa is a self-hosted household service log. This spec is the
    single source of truth for the Go server's HTTP surface: it drives
    runtime request validation (kin-openapi via nethttp-middleware), the
    generated strict-server routes and types (oapi-codegen), and — being the
    routing table the validator matches against — which paths exist at all.

    Edit this file, then run `go generate ./...` from apps/server: that
    resyncs the embedded copy (apps/server/internal/api/mi-casa.yaml) and
    regenerates apps/server/internal/api/gen. Both are committed, and a test
    fails if either drifts.
  version: "1.0.0"
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe. Touches nothing — not even the database pool.
      tags: [system]
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
  /readyz:
    get:
      operationId: readyz
      summary: >-
        Readiness probe. Reads the installation singleton, which both proves
        the database is reachable and carries the retention job's last run.
      tags: [system]
      responses:
        "200":
          description: The process is ready to serve traffic.
          content:
            application/json:
              schema:
                type: object
                required: [ok, status, setupConfigured, retention]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  status:
                    type: string
                  setupConfigured:
                    type: boolean
                  retention:
                    type: object
                    required: [lastRunAt, stale]
                    properties:
                      lastRunAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: >-
                          When the retention job last completed, or null if it
                          never has.
                      stale:
                        type: boolean
                        description: >-
                          Whether the last run is older than the tolerated
                          window (48 hours), or has never happened.
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                type: object
                required: [ok, error]
                properties:
                  ok:
                    type: boolean
                    enum: [false]
                  error:
                    type: string
  /api/setup/status:
    get:
      operationId: getSetupStatus
      summary: >-
        First-run state. Public and deliberately says nothing about who the
        owner is — the installation's contact address is not a secret worth
        publishing, and a visitor only needs to know whether the setup screen
        should open at all.
      tags: [setup]
      responses:
        "200":
          description: The installation's first-run state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /api/setup/complete:
    post:
      operationId: completeSetup
      summary: >-
        Claim the installation: create the owner account, their first
        household, and lock setup. Rate limited (5 per 15 minutes) because the
        body carries SETUP_SECRET.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: >-
            Setup completed. The response also carries the owner's session
            cookie, so the SPA lands signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResult"
        "400":
          description: The request was rejected. See the envelope's `error` (and `fields`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Refused. See the envelope's `error` for which check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The request conflicts with the installation's current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited. `Retry-After` says when to come back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The request could not be completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/invitations/lookup:
    get:
      operationId: lookupInvitation
      summary: >-
        What an invitation link points at, for the invite page. Public and rate
        limited (20 per 10 minutes): together with accept, this is the one
        unauthenticated path that reveals whether a token exists.
      tags: [invitations]
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: The invitation, who sent it, and how the viewer relates to it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationLookup"
        "400":
          description: The request was rejected. See the envelope's `error` (and `fields`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such invitation, or it is no longer valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The invitation has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited. `Retry-After` says when to come back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: >-
        Accept an invitation, as the signed-in user or by creating the invited
        account. Rate limited with the lookup above.
      tags: [invitations]
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      requestBody:
        # Not required: a signed-in user accepts with the account they already
        # have and sends no body at all. An anonymous caller must send both
        # properties, which is a cross-field rule (it depends on the session)
        # and so is checked in Go rather than here.
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Accepted by the signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResult"
        "201":
          description: >-
            The invited account was created and the invitation accepted. The
            response also carries the new session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResult"
        "400":
          description: The request was rejected. See the envelope's `error` (and `fields`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Refused. See the envelope's `error` for which check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such invitation, or it is no longer valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The request conflicts with the installation's current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The invitation has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited. `Retry-After` says when to come back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The request could not be completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/households/me:
    get:
      operationId: listMyHouseholds
      summary: >-
        Every household the caller belongs to, for the household switcher.
        Ordered by lower-cased display name so the list does not reshuffle
        when somebody renames a household with a capital letter.
      tags: [households]
      responses:
        "200":
          description: The caller's households.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdList"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/households:
    post:
      operationId: createHousehold
      summary: >-
        Create a household with the caller as its owner. Restricted (REF §A2):
        the installation owner may always; anybody else only while they belong
        to no household at all, so a member cannot mint extra households or
        squat inbound addresses. Rate limited (10 per hour).
      tags: [households]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdRequest"
      responses:
        "201":
          description: >-
            The household, in the same shape as a /api/households/me entry so
            the client can use it without a refetch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdResult"
        "400":
          description: The request was rejected. See the envelope's `error` (and `fields`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller may not create a household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The slug is taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited. `Retry-After` says when to come back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/households/{slug}/leave:
    post:
      operationId: leaveHousehold
      summary: >-
        Give up your own membership of this household. Refused for the last
        owner, which is what keeps a household from being left with nobody who
        can administer it.
      tags: [households]
      parameters:
        - $ref: "#/components/parameters/HouseholdSlug"
      responses:
        "200":
          description: The membership is gone; provider access cascaded with it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not a member of this household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The caller is the household's only owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/inbox/{slug}/providers:
    get:
      operationId: listInboxProviders
      summary: >-
        The inbox landing page: one tile per provider the caller may read,
        with its message counts and a preview of the newest message.

        A member route rather than an owner one, with the per-provider check
        INSIDE it: an owner sees every provider in the household, a member
        only the ones they have been granted. That is the whole point of
        provider access — the household's mail is split per mailbox, not
        per role.
      tags: [inbox]
      parameters:
        - $ref: "#/components/parameters/HouseholdSlug"
      responses:
        "200":
          description: The providers this caller may read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSummaryList"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not a member of this household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/inbox/{slug}/providers/{providerKey}:
    get:
      operationId: listProviderMessages
      summary: >-
        One provider's inbox, newest first, one keyset page at a time.

        The 403 for a member without access to this provider is answered
        BEFORE the provider is looked up, so a member cannot use the
        difference between 403 and 404 to enumerate which providers the
        household has.
      tags: [inbox]
      parameters:
        - $ref: "#/components/parameters/HouseholdSlug"
        - name: providerKey
          in: path
          required: true
          description: >-
            The provider's key, scoped to the household in the path. Bounded
            the way `revokeProviderAccess` bounds its own copy (REF §A4's
            `providerAccess` rules), because a path parameter has no `fields`
            entry to render a Go-side message against.
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageBefore"
      responses:
        "200":
          description: The page of messages, with the cursor for the next one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMessagePage"
        "400":
          description: The provider key or a page parameter is not of the stated shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            The caller is not a member of this household, or is a member
            without access to this provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: This household has no such provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/inbox/{slug}/messages/{messageId}/status:
    patch:
      operationId: updateMessageStatus
      summary: >-
        Mark one message new, used or expired — the "I have used this code"
        button.

        The message is looked up before the body is validated, deliberately:
        a status the server does not know, sent for a message that is not
        this household's, is answered 404 rather than 400, so the route never
        confirms the existence of a message the caller may not read.
      tags: [inbox]
      parameters:
        - $ref: "#/components/parameters/HouseholdSlug"
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageStatusRequest"
      responses:
        "200":
          description: The message as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMessageResult"
        "400":
          description: The request was rejected. See the envelope's `error` (and `fields`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            The caller is not a member of this household, or is a member
            without access to the message's provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: This household has no such message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/inbox/{slug}/quarantine:
    get:
      operationId: listQuarantine
      summary: >-
        The needs-review queue: mail that could not be attributed to a
        provider, unreviewed rows only, newest first.

        Owner-only. Quarantined mail is by definition mail nobody has decided
        who may read yet, so it cannot be shown behind per-provider access.
      tags: [inbox]
      parameters:
        - $ref: "#/components/parameters/HouseholdSlug"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageBefore"
      responses:
        "200":
          description: The page of quarantined messages, with the cursor for the next one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarantineMessagePage"
        "400":
          description: A page parameter is not of the stated shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not an owner of this household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/inbox/{slug}/quarantine/{messageId}/review:
    post:
      operationId: reviewQuarantineMessage
      summary: >-
        Work through one needs-review row: dismiss it, or release it into a
        provider's inbox.

        A release copies the row into that provider's messages — keeping the
        original received_at and delete_after, so releasing does not extend
        retention — and marks the quarantine row reviewed, in one
        transaction. Owner-only, and audited either way.
      tags: [inbox]
      parameters:
        - $ref: "#/components/parameters/HouseholdSlug"
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuarantineReviewRequest"
      responses:
        "200":
          description: >-
            The review. `releasedMessage` is the stored copy for a release
            and null for a dismissal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarantineReviewResult"
        "400":
          description: The request was rejected. See the envelope's `error` (and `fields`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not an owner of this household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            This household has no such provider, or no such unreviewed
            quarantine message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/settings:
    get:
      operationId: getAccountSettings
      summary: >-
        The account settings screen in one request: the caller's profile with
        their households, and their signed-in devices newest first.
      tags: [settings]
      responses:
        "200":
          description: The profile and the session list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettings"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The session's account no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/settings/households:
    get:
      operationId: listSettingsHouseholds
      summary: >-
        The caller's households, the same list GET /api/households/me answers
        with. It exists separately because the settings screen refetches it on
        its own after leaving a household.
      tags: [settings]
      responses:
        "200":
          description: The caller's households.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdList"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/settings/profile:
    patch:
      operationId: updateProfile
      summary: Update the caller's display name and avatar.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRequest"
      responses:
        "200":
          description: The profile as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResult"
        "400":
          description: The request was rejected. See the envelope's `error` (and `fields`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The session's account no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/settings/sessions/others:
    delete:
      operationId: revokeOtherSessions
      summary: >-
        Sign out everywhere else: every session of this account except the one
        this request arrived on.
      tags: [settings]
      responses:
        "200":
          description: The other sessions are gone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/settings/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: >-
        Revoke one device. A session id that is not the caller's own revokes
        nothing and still answers 200 — deliberately, so the endpoint cannot be
        used to discover whether an id exists.
      tags: [settings]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: The session is gone, if it was the caller's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/{slug}/audit:
    get:
      operationId: listAuditEvents
      summary: >-
        The household's audit trail, newest 100 first. Owner-only: it names
        who did what to whom, which is exactly the sort of thing a member has
        no business reading about the rest of the household.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/HouseholdSlug"
      responses:
        "200":
          description: The trail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not an owner of this household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/{slug}/settings:
    get:
      operationId: getHouseholdSettings
      summary: >-
        The household's own settings: its name and the inbound address
        providers must be told to send codes to.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/HouseholdSlug"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdSettingsResult"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not an owner of this household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The household is gone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateHouseholdSettings
      summary: Rename the household. The slug — and therefore the inbound address — never changes.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/HouseholdSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdSettingsRequest"
      responses:
        "200":
          description: The settings, as they now stand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdSettingsResult"
        "400":
          description: The request was rejected. See the envelope's `error` (and `fields`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not an owner of this household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The household is gone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/{slug}/providers:
    get:
      operationId: listProviderConfigurations
      summary: >-
        Every provider in the household with the number of sender rules that
        point at it, plus the rules themselves — the two halves of the
        provider settings screen in one request.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/HouseholdSlug"
      responses:
        "200":
          description: The providers and their sender rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfigurationList"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not an owner of this household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createProvider
      summary: Add a provider — the mailbox a set of sender rules files messages into.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/HouseholdSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderRequest"
      responses:
        "201":
          description: The provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderResult"
        "400":
          description: The request was rejected. See the envelope's `error` (and `fields`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not an owner of this household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A provider with that key already exists in this household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/{slug}/providers/{providerId}:
