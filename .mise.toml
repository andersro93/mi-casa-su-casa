# Toolchain pin for Mi Casa Su Casa — the single source of truth for dev AND
# CI. `mise install` in the repo gives everyone the same Go + Bun + Node plus
# the codegen tools `go generate` expects on PATH (sqlc, oapi-codegen, goose).
# CI installs from this same file via jdx/mise-action, naming per job only
# what that job runs (install_args): the test job adds the codegen tools and
# goreleaser, the image job adds svu, the release job adds goreleaser,
# cosign and syft. CI never runs `go generate` — generated code is
# committed and a drift-guard test enforces it — but the codegen binaries
# are still installed because that test shells out to them.
[tools]
go = "1.27.0"
bun = "1.4"
node = "22"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "1.31.1"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.8.0"
"go:github.com/pressly/goose/v3/cmd/goose" = "3.28.0"
"aqua:goreleaser/goreleaser" = "2.18.0"
"aqua:caarlos0/svu" = "3.4.1"
"aqua:sigstore/cosign" = "3.1.3"
"aqua:anchore/syft" = "1.51.1"

# ─── Tasks ────────────────────────────────────────────────────────────────
# `mise run <task>` — runs with the pinned toolchain above, always.

[tasks.test]
description = "Full suite: Go (real Postgres from docker-compose.test.yml) + frontend/landing"
run = [
  "cd apps/server && go vet ./... && go test -p 1 -count=1 ./...",
  "bun run test",
]

[tasks.check]
description = "Lint, typecheck, i18n coverage, goreleaser config"
run = ["bun run check", "goreleaser check"]

[tasks.artifacts]
description = "SPA + both server binaries → dist/server/linux/<arch>/mi-casa"
run = "bash scripts/build-artifacts.sh"

[tasks.image]
description = "Multi-arch image via buildx (runs artifacts first)"
run = "bash scripts/build-image.sh"

[tasks.snapshot]
description = "Full GoReleaser dry run: archives, SBOMs, local image (no publish, no signing)"
run = """
trap 'bash scripts/restore-embed-overlay.sh' EXIT
goreleaser release --snapshot --clean --skip=sign
"""

[tasks.e2e]
description = "Playwright E2E against the real image (builds it if missing)"
run = """
trap 'bash scripts/e2e-stack.sh down' EXIT
bash scripts/e2e-stack.sh up
cd e2e && bunx playwright test
"""
