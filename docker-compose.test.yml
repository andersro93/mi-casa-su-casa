# The database the Go test suite runs against:
#
#   docker compose -f docker-compose.test.yml up -d
#   mise run test
#
# Kept separate from any deployable compose file so the deployable stack does
# not carry a published database port or a second database it never uses.

name: mi-casa-su-casa-test

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: micasa
      POSTGRES_PASSWORD: micasa
      POSTGRES_DB: micasa_test
    ports:
      # An unusual port, bound to loopback: it must not collide with a
      # Postgres the developer already runs, and it must not be reachable
      # from anywhere else.
      - "127.0.0.1:55433:5432"
    # No volume. Test data is meant to be thrown away, and a stale volume is
    # a great way to spend an afternoon debugging a schema that moved on.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micasa -d micasa_test"]
      interval: 3s
      timeout: 3s
      retries: 20
